# The service account of the driver may create and delete only the
# companion pods and ResourceClaims of the leases of the node that its pod
# runs on: objects with the labels of a lease and the node label of that
# node, and pods pinned to that node that run the companion image without
# volumes, host namespaces or privileged containers. Needs the
# ServiceAccountTokenPodNodeInfo feature (on by default since Kubernetes
# 1.30).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: lease-companions-policy-nri-dra-driver-cxl
  labels:
    {{- include "nri-plugin.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:   [""]
      apiVersions: ["v1"]
      operations:  ["CREATE", "DELETE"]
      resources:   ["pods"]
    - apiGroups:   ["resource.k8s.io"]
      apiVersions: ["v1"]
      operations:  ["CREATE", "DELETE"]
      resources:   ["resourceclaims"]
  matchConditions:
  - name: isRestrictedUser
    expression: >-
      request.userInfo.username == "system:serviceaccount:{{ .Release.Namespace }}:nri-dra-driver-cxl"
  variables:
  - name: userNodeName
    expression: >-
      request.userInfo.?extra[?'authentication.kubernetes.io/node-name'][0].orValue('')
  - name: labels
    expression: >-
      (request.operation == "DELETE" ? oldObject : object).metadata.?labels.orValue({})
  - name: objectNodeName
    expression: >-
      variables.labels[?'cxl.nri.io/node'].orValue('')
  - name: isPodCreate
    expression: >-
      request.operation == "CREATE" && request.resource.resource == "pods"
  # The facts of a pod to create, read only for pods: true, empty or false
  # for ResourceClaims and deletions.
  - name: podPinned
    expression: >-
      !variables.isPodCreate ||
      (object.spec.?nodeName.orValue(variables.userNodeName) == variables.userNodeName &&
       object.spec.?affinity.?nodeAffinity.?requiredDuringSchedulingIgnoredDuringExecution.?nodeSelectorTerms.orValue([]).size() > 0 &&
       object.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms.all(t,
         t.?matchFields.orValue([]).exists(r, r.key == 'metadata.name' && r.operator == 'In' && r.values == [variables.userNodeName])))
  - name: podVolumes
    expression: >-
      variables.isPodCreate ? object.spec.?volumes.orValue([]) : []
  - name: podHostNamespaces
    expression: >-
      variables.isPodCreate &&
      (object.spec.?hostNetwork.orValue(false) || object.spec.?hostPID.orValue(false) || object.spec.?hostIPC.orValue(false))
  - name: containers
    expression: >-
      variables.isPodCreate ? object.spec.containers + object.spec.?initContainers.orValue([]) : []
  validations:
  - expression: variables.userNodeName != ""
    message: >-
      no node association found for user, this user must run in a pod on a node and ServiceAccountTokenPodNodeInfo must be enabled
  - expression: >-
      request.operation != "CREATE" ||
      (variables.labels[?'cxl.nri.io/lease'].orValue('') != '' &&
       variables.labels[?'cxl.nri.io/requester-uid'].orValue('') != '' &&
       variables.objectNodeName != '')
    messageExpression: >-
      "this user may create only " + request.resource.resource +
      " with the labels cxl.nri.io/lease, cxl.nri.io/requester-uid and cxl.nri.io/node of a lease companion"
  - expression: variables.userNodeName == variables.objectNodeName
    messageExpression: >-
      "this user running on node '" + variables.userNodeName + "' may not " +
      request.operation.lowerAscii() + " " + request.resource.resource +
      (variables.objectNodeName == "" ? " without the label cxl.nri.io/node" : " of node '" + variables.objectNodeName + "'")
  - expression: variables.podPinned
    messageExpression: >-
      "this user running on node '" + variables.userNodeName +
      "' may create only pods whose required node affinity selects that node by metadata.name in every term"
  - expression: size(variables.podVolumes) == 0
    message: >-
      this user may not create pods with volumes
  - expression: "!variables.podHostNamespaces"
    message: >-
      this user may not create pods in the host network, PID or IPC namespace
  - expression: >-
      variables.containers.all(c, !c.?securityContext.?privileged.orValue(false))
    message: >-
      this user may not create pods with privileged containers
  - expression: >-
      variables.containers.all(c, c.image == {{ .Values.leases.companionImage | quote }})
    message: >-
      this user may create only pods whose containers run the companion image {{ .Values.leases.companionImage }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: lease-companions-policy-nri-dra-driver-cxl
  labels:
    {{- include "nri-plugin.labels" . | nindent 4 }}
spec:
  policyName: lease-companions-policy-nri-dra-driver-cxl
  validationActions: [Deny]
