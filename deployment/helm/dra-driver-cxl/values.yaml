# Default values for dra-driver-cxl.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
---
image:
  name: ghcr.io/containers/nri-plugins/nri-dra-driver-cxl
  # tag, if defined will use the given image tag, otherwise Chart.AppVersion will be used
  #tag: unstable
  pullPolicy: Always

resources:
  cpu: 10m
  memory: 128Mi

nri:
  plugin:
    # Through NRI the driver keeps containers off the CXL memory they did
    # not claim, steers containers that opt in, and lends memory to
    # running containers.
    index: 30
  runtime:
    patchConfig: false
#   config:
#     pluginRegistrationTimeout: 5s
#     pluginRequestTimeout: 2s

pool:
  # DRA driver name of the CXL memory pool driver, "" disables it.
  driverName: cxl-pool.nri.io
  # How long the pool driver waits for a hotplugged CXL memory device.
  prepareTimeout: 30s

leases:
  # Lend memory to running containers.
  enabled: true
  # How long a lease request waits for Ready when it does not say.
  wait: 120s
  # Image of the companion pods of leases.
  companionImage: registry.k8s.io/pause:3.10

# Driver configuration, see docs/memory/cxl/usage.md. The driver reads it
# only when it starts; a change restarts the DaemonSet.
config: {}
#
# Example:
#
# config:
#   ignoreDevices: ["mem0"]
#   manageMemdevs: true
#   # local devices shared by the claims of class cxl-local-shared
#   sharedDevices: ["0xc100e2e1"]
#   # node defaults of the settings of containers, which the
#   # MemoryConfigs of their claims override
#   defaults:
#     container:
#       # none (default): not steered; auto steers every container with
#       # numa memory
#       steering: {policy: none}
#       # keep containers off the CXL nodes of the driver that they did not
#       # claim: allowed-mems (default) | mempolicy | none; none next to an
#       # NRI resource policy that sets cpuset.mems (balloons,
#       # topology-aware)
#       fencing: allowed-mems

# MemoryConfig presets of the DeviceClasses of the chart: class name ->
# the body of a MemoryConfig (device, container; pool for the cxl-pool*
# classes). The chart renders it into the spec.config of the class as an
# opaque entry of the class's driver, apiVersion cxl.nri.io/v1alpha1, kind
# MemoryConfig. Claims of the class change it field by field. See
# docs/memory/cxl/usage.md.
deviceClassConfig: {}
#
# Example: steering on for the containers with local CXL memory, unless
# their claim says container: {steering: {policy: none}}
#
# deviceClassConfig:
#   cxl-local:
#     container:
#       steering: {policy: auto}

# Log verbosity (-v).
logLevel: 4

# Extra environment variables to inject.
extraEnv: {}
#
# Example:
#
# extraEnv:
#   VAR1: VAL1
#   VAR2: VAL2

initContainerImage:
  name: ghcr.io/containers/nri-plugins/nri-config-manager
  # If not defined Chart.AppVersion will be used
  #tag: unstable
  pullPolicy: Always

tolerations: []
#
# Example:
#
# tolerations:
# - key: "node-role.kubernetes.io/control-plane"
#   operator: "Exists"
#   effect: "NoSchedule"

affinity: {}
#
# Example:
#
# affinity:
#   nodeAffinity:
#     requiredDuringSchedulingIgnoredDuringExecution:
#       nodeSelectorTerms:
#       - matchExpressions:
#         - key: topology.kubernetes.io/disk
#           operator: In
#           values:
#           - ssd

nodeSelector: {}
#
# Example:
#
# nodeSelector:
#  kubernetes.io/disk: "ssd"

# NRI plugins should be considered as part of the container runtime.
# By default we make them part of the system-node-critical priority
# class. This should mitigate the potential risk of a plugin getting
# evicted under heavy system load. It should also ensure that during
# autoscaling enough new nodes are brought up to leave room for the
# plugin on each new node.
podPriorityClassNodeCritical: true
