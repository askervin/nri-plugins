# A read-write filesystem on a device of persistent memory of a memory
# pool (DeviceClass cxl-pool-persistent), with a writer and a reader on one
# node. The formatter's claim requests no shares (the whole device,
# exclusive) and MemoryConfig device.mode: block: its container gets the
# block device of the fsdax namespace of the device and makes an ext4 on
# it (block size 4096, which DAX needs), then finishes. The writer and the
# reader join after it with one share each (capacity.requests.shares: "1")
# and device.mode: fs: the writer opts in to write with readOnly: false,
# the reader has no readOnly (read-only). The node mounts the ext4 once
# (access direct: the file pages are the memory of the device) and gives
# each container a bind of it, read-write or read-only.
# The nodes mount erofs only unless the driver configuration lists more
# types: this sample needs fsTypes: [erofs, ext4] (Helm value
# config.fsTypes), which trusts every party that can write the device raw
# (its read-write block claims and leases) not to plant a crafted ext4.
# ReadWriteOnce: while the writer has the device, the pool controller
# attaches it to the writer's node only; a claim of another node waits
# (AttachFailed, reason Conflict). The reader's podAffinity puts it on the
# writer's node.
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: fs-rw-formatter
spec:
  devices:
    requests:
    - name: mem
      exactly:
        deviceClassName: cxl-pool-persistent
        selectors:
        - cel:
            expression: 'device.attributes["cxl-pool.nri.io"].serial == "0xc1ae0001"'
        # no capacity request: the whole device, the only claim of it
    config:
    - opaque:
        driver: cxl-pool.nri.io
        parameters:
          apiVersion: cxl.nri.io/v1alpha1
          kind: MemoryConfig
          device:
            mode: block
---
apiVersion: v1
kind: Pod
metadata:
  name: fs-rw-formatter
spec:
  restartPolicy: Never
  resourceClaims:
  - name: mem
    resourceClaimName: fs-rw-formatter
  containers:
  - name: formatter
    image: registry.fedoraproject.org/fedora:43
    command:
    - sh
    - -ec
    - |
      dnf install -q -y e2fsprogs
      mkfs.ext4 -F -b 4096 "$CXL_C1AE0001_PATH"
      echo "made an ext4 on $CXL_C1AE0001_PATH"
    resources:
      claims:
      - name: mem
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: fs-rw-writer
spec:
  devices:
    requests:
    - name: mem
      exactly:
        deviceClassName: cxl-pool-persistent
        selectors:
        - cel:
            expression: 'device.attributes["cxl-pool.nri.io"].serial == "0xc1ae0001"'
        capacity:
          requests:
            shares: "1"  # one share
    config:
    - opaque:
        driver: cxl-pool.nri.io
        parameters:
          apiVersion: cxl.nri.io/v1alpha1
          kind: MemoryConfig
          device:
            mode: fs
            readOnly: false  # the opt-in to write
            fsType: ext4     # optional: refused if the device has another type
            path: /data
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: fs-rw-reader
spec:
  devices:
    requests:
    - name: mem
      exactly:
        deviceClassName: cxl-pool-persistent
        selectors:
        - cel:
            expression: 'device.attributes["cxl-pool.nri.io"].serial == "0xc1ae0001"'
        capacity:
          requests:
            shares: "1"  # one share
    config:
    - opaque:
        driver: cxl-pool.nri.io
        parameters:
          apiVersion: cxl.nri.io/v1alpha1
          kind: MemoryConfig
          device:
            mode: fs     # read-only: no readOnly
            path: /data
---
apiVersion: v1
kind: Pod
metadata:
  name: fs-rw-writer
  labels:
    app: fs-rw-writer
spec:
  resourceClaims:
  - name: mem
    resourceClaimName: fs-rw-writer
  containers:
  - name: writer
    image: docker.io/library/busybox:stable
    command: ["sh", "-c", "env | grep ^CXL_ | sort; date > /data/hello.txt; sync; cat /data/hello.txt; sleep 1000000"]
    resources:
      claims:
      - name: mem
---
apiVersion: v1
kind: Pod
metadata:
  name: fs-rw-reader
spec:
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app: fs-rw-writer
        topologyKey: kubernetes.io/hostname
  resourceClaims:
  - name: mem
    resourceClaimName: fs-rw-reader
  containers:
  - name: reader
    image: docker.io/library/busybox:stable
    command: ["sh", "-c", "env | grep ^CXL_ | sort; until cat /data/hello.txt; do sleep 1; done; touch /data/x || echo 'read-only, as expected'; sleep 1000000"]
    resources:
      claims:
      - name: mem
