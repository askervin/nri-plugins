config:
  agent:
    nodeResourceTopology: true
  allocatorTopologyBalancing: false
  availableResources:
    cpu: cpuset:2-7,10-13 # policy must not touch IRQ affinity of unavailable CPUs
  reservedResources:
    cpu: 750m

  pinCPU: true

  idleCPUClass: default-class

  balloonTypes:
  - name: irq-masking-bln
    cpuClass: irq-masking-class

  cpuClasses:
  - name: irq-masking-class
    disableIRQs: true
  - name: default-class
    disableIRQs: false

  log:
    debug:
      - policy
      - nri-plugin
      - cpu
      - cpuclass
extraEnv:
  OVERRIDE_SYS_IRQS: '''[{"irq": 0, "mask": "0x00000000", "name": "INIT_IRQ"}, {"irq": 1, "mask": "0x00000000", "name": "IRQ1"}, {"irq": 2, "mask": "0x00000000", "name": "IRQ2"}, {"irq": 3, "mask": "0x00000000", "name": "IRQ3"}, {"irq": 4, "mask": "0x00000000", "name": "IRQ4"}, {"irq": 5, "mask": "0x00000000", "name": "IRQ5"}, {"irq": 6, "mask": "0x00000000", "name": "IRQ6"}, {"irq": 7, "mask": "0x00000000", "name": "IRQ7"}, {"irq": 8, "mask": "0x00000000", "name": "IRQ8"}, {"irq": 9, "mask": "0x00000000", "name": "IRQ9"}, {"irq": 10, "mask": "0x00000000", "name": "IRQ10"}, {"irq": 11, "mask": "0x00000000", "name": "IRQ11"}, {"irq": 12, "mask": "0x00000000", "name": "IRQ12"}, {"irq": 13, "mask": "0x00000000", "name": "IRQ13"}, {"irq": 14, "mask": "0x00000000", "name": "IRQ14"}, {"irq": 15, "mask": "0x00000000", "name": "IRQ15"}]'''
